[pytest]
# This is the LEGACY app's suite only (test_storage.py + conftest.py).
#
# The PySide6/SQLAlchemy rewrite in inventory_system/ carries its own
# pyproject.toml (testpaths = ["tests"]) and its own dependencies, and is run
# from inside that directory:  cd inventory_system && pytest
#
# Scoped explicitly for two reasons: a bare `pytest` here would otherwise try
# to collect the rewrite's tests and fail on its uninstalled dependencies, and
# this directory's conftest.py installs an AUTOUSE sandbox fixture that must
# never apply to another suite's tests.
testpaths = test_storage.py
norecursedirs = inventory_system .venv venv build dist .git __pycache__

name: release

# Builds the Windows .exe and attaches it to a GitHub Release.
# PyInstaller cannot cross-compile, so this is the only way to produce the
# binary without sitting at a Windows machine.

on:
  push:
    tags: ["v*"]
  # Also build (but do not publish) on PRs that touch the legacy app, so the
  # binary can be downloaded and smoke-tested before anything is tagged.
  pull_request:
    paths:
      - "inventory_app.py"
      - "storage.py"
      - "requirements*.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the tests before shipping anything
        run: python -m pytest -q

      - name: Build InventoryManagement.exe
        run: >
          python -m PyInstaller --onefile --windowed
          --name InventoryManagement inventory_app.py

      - name: Verify the build actually produced an exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/InventoryManagement.exe")) {
            Write-Error "dist/InventoryManagement.exe is missing"
            exit 1
          }
          $size = (Get-Item "dist/InventoryManagement.exe").Length
          Write-Host "Built InventoryManagement.exe ($([math]::Round($size/1MB,1)) MB)"
          if ($size -lt 3MB) { Write-Error "exe is implausibly small"; exit 1 }

      - name: Record the checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash "dist/InventoryManagement.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  InventoryManagement.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Host "sha256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: InventoryManagement-windows
          path: |
            dist/InventoryManagement.exe
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Inventory Management ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/InventoryManagement.exe
            dist/SHA256SUMS.txt
